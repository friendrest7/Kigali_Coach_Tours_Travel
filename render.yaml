databases:
  - name: kigali-coach-tours-db
    databaseName: kigali_coach_tours
    user: kctt_app
    postgresMajorVersion: 16
    region: frankfurt
    plan: 0.1c-256mb

services:
  - type: web
    name: kigali-coach-tours-api
    runtime: go
    rootDir: backend
    region: frankfurt
    plan: starter
    buildCommand: go build -o bin/api ./cmd/api
    preDeployCommand: go run ./cmd/migrate
    startCommand: ./bin/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kigali-coach-tours-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_CURRENCY
        value: RWF
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MTN_MOMO_BASE_URL
        value: https://sandbox.momodeveloper.mtn.com
      - key: MTN_MOMO_TARGET_ENVIRONMENT
        value: sandbox
      - key: MTN_MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MTN_MOMO_API_USER
        sync: false
      - key: MTN_MOMO_API_KEY
        sync: false
      - key: MTN_MOMO_CALLBACK_URL
        sync: false
